# SonarCloud Configuration for BrightSwagShop Frontend

# Project identification
sonar.projectKey=BrightSwagShop_Brightswagshop-Frontend
sonar.organization=brightswagshop

# Project metadata
sonar.projectName=BrightSwagShop Frontend
sonar.projectVersion=1.0

# Source code location
sonar.sources=src
sonar.tests=src,WebTests

# Test file patterns
sonar.test.inclusions=**/__tests__/**/*.ts,**/__tests__/**/*.tsx,**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx

# Exclude patterns
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.config.js,**/*.config.ts,**/vite-env.d.ts,**/playwright-report/**,**/test-results/**

# Coverage paths
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Language
sonar.language=ts

# Source encoding
sonar.sourceEncoding=UTF-8

# TypeScript specific
sonar.typescript.tsconfigPath=tsconfig.json
