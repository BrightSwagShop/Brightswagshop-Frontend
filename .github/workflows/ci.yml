name: Frontend CI/CD

on:
  push:
  pull_request:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for Sonar blame info
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Setup Chrome for Headless Testing
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Dependency vulnerability check (npm audit)
        working-directory: ./frontend
        continue-on-error: true
        run: npm audit --audit-level=high
      
      - name: Lint (ESLint)
        working-directory: ./frontend
        run: npm run lint

      - name: Type check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run Tests
        working-directory: ./frontend
        run: npm run test:run -- --coverage

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Frontend Tests
          path: ./frontend/junit.xml
          reporter: java-junit

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./frontend/coverage

      - name: Debug coverage path
        working-directory: ./frontend
        continue-on-error: true
        run: |
          echo "Listing coverage files..."
          ls -R ./coverage || echo "No coverage directory found"

    #  SonarCloud analysis WIP
    #      
    #  - name: SonarCloud Analysis
    #    uses: SonarSource/sonarcloud-github-action@v2
    #    with:
    #      projectBaseDir: ./frontend
    #    env:
    #      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    #      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        working-directory: ./frontend
        run: npm run e2e
        continue-on-error: true

      - name: Debug Playwright Report
        if: always()
        working-directory: ./frontend
        run: |
          echo "Checking for Playwright report..."
          ls -la playwright-report/ || echo "No playwright-report directory found"
          if [ -f playwright-report/index.html ]; then
            echo "Playwright report exists!"
            ls -lh playwright-report/index.html
          else
            echo "Warning: playwright-report/index.html not found"
          fi

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ./frontend/playwright-report/
          retention-days: 30

      - name: Send Playwright Report via Email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Playwright Test Report - ${{ github.repository }} [${{ github.ref_name }}]"
          to: wout.boonen@brightest.be
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          html_body: |
            <h2>Playwright Test Report</h2>
            <p><strong>Repository:</strong> ${{ github.repository }}</p>
            <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
            <p><strong>Commit:</strong> ${{ github.sha }}</p>
            <p><strong>Triggered by:</strong> ${{ github.actor }}</p>
            <p><strong>Workflow:</strong> ${{ github.workflow }}</p>
            <p><strong>Run ID:</strong> ${{ github.run_id }}</p>
            <hr>
            <p>The full HTML report is attached to this email.</p>
            <p>You can also view it in the GitHub Actions artifacts: 
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Run</a></p>
          attachments: ./frontend/playwright-report/index.html
          ignore_cert: false
          convert_markdown: false
        continue-on-error: false

      - name: Build for production
        working-directory: ./frontend
        run: npm run build
        
      - name: Deploy to Render
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}