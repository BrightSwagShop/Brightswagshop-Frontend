name: Frontend CI/CD

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for Sonar blame info
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Setup Chrome for Headless Testing
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Dependency vulnerability check (npm audit)
        working-directory: ./frontend
        continue-on-error: true
        run: |
          npm audit --audit-level=high
      
      - name: Lint (ESLint)
        working-directory: ./frontend
        run: npm run lint

      - name: Type check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run Tests
        working-directory: ./frontend
        run: npm run test:run

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Vitest Tests
          path: ./frontend/junit.xml
          reporter: java-junit

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./frontend/coverage

      - name: Debug coverage path
        working-directory: ./frontend
        run: |
          echo "Listing coverage files..."
          ls -R ./coverage || echo "No coverage directory found"

      - name: SonarCloud Analysis
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: ./frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for production
        working-directory: ./frontend
        run: npm run build
