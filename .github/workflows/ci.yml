name: Frontend CI/CD

on:
  push:
  pull_request:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for Sonar blame info
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Setup Chrome for Headless Testing
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Dependency vulnerability check (npm audit)
        working-directory: ./frontend
        continue-on-error: true
        run: npm audit --audit-level=high
      
      - name: Lint (ESLint)
        working-directory: ./frontend
        run: npm run lint

      - name: Type check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run Tests
        working-directory: ./frontend
        run: npm run test:run -- --coverage

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Frontend Tests
          path: ./frontend/junit.xml
          reporter: java-junit

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./frontend/coverage

      - name: Debug coverage path
        working-directory: ./frontend
        continue-on-error: true
        run: |
          echo "Listing coverage files..."
          ls -R ./coverage || echo "No coverage directory found"

      - name: SonarCloud Analysis
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: ./frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        working-directory: ./frontend
        env:
          QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_TESTOPS_API_TOKEN }}
          QASE_TESTOPS_PROJECT: ${{ secrets.QASE_TESTOPS_PROJECT }}
          QASE_TESTOPS_RUN_COMPLETE: true
          ENTRA_ID_TENANT_ID: ${{ secrets.ENTRA_ID_TENANT_ID }}
          ENTRA_ID_CLIENT_ID: ${{ secrets.ENTRA_ID_CLIENT_ID }}
        run: npm run webtests

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ./frontend/playwright-report/
          retention-days: 30

      - name: Send Playwright Report via Email (SendGrid API)
        if: always()
        run: |
          # Check if report exists
          if [ ! -f ./frontend/playwright-report/index.html ]; then
            echo "Playwright report not found, skipping email"
            exit 0
          fi
          
          # Create JSON payload file (without attachment - just link to artifact)
          cat > email_payload.json << 'EOF'
          {
            "personalizations": [{
              "to": [{"email": "boonenwout@gmail.com"}]
            }],
            "from": {"email": "wout.boonen@brightest.be", "name": "GitHub Actions"},
            "subject": "Playwright Test Report - REPO [BRANCH]",
            "content": [{
              "type": "text/html",
              "value": "HTML_CONTENT"
            }]
          }
          EOF
          
          # Replace placeholders
          sed -i "s|REPO|${{ github.repository }}|g" email_payload.json
          sed -i "s|BRANCH|${{ github.ref_name }}|g" email_payload.json
          sed -i "s|HTML_CONTENT|<h2>Playwright Test Report</h2><p><strong>Repository:</strong> ${{ github.repository }}</p><p><strong>Branch:</strong> ${{ github.ref_name }}</p><p><strong>Commit:</strong> ${{ github.sha }}</p><p><strong>Triggered by:</strong> ${{ github.actor }}</p><p><strong>Workflow:</strong> ${{ github.workflow }}</p><p><strong>Run ID:</strong> ${{ github.run_id }}</p><hr><p><strong>View the full HTML report in GitHub Actions artifacts:</strong></p><p><a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' style='display:inline-block;padding:10px 20px;background-color:#F4C709;color:#3C3C3B;text-decoration:none;border-radius:5px;font-weight:bold;'>Download Playwright Report</a></p><p>Click the link above, scroll to the Artifacts section, and download the <code>playwright-report</code> artifact.</p>|g" email_payload.json
          
          # Send email via SendGrid API and capture response
          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST https://api.sendgrid.com/v3/mail/send \
            -H "Authorization: Bearer ${{ secrets.SENDGRID_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @email_payload.json)
          
          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$HTTP_RESPONSE" | head -n-1)
          
          echo "HTTP Status Code: $HTTP_CODE"
          echo "Response: $RESPONSE_BODY"
          
          if [ "$HTTP_CODE" -eq 202 ]; then
            echo "Email sent successfully to boonenwout@gmail.com!"
          else
            echo "Failed to send email"
            echo "Response body: $RESPONSE_BODY"
            exit 1
          fi
        continue-on-error: false

      - name: Build for production
        working-directory: ./frontend
        run: npm run build

      - name: Trigger cross-repo E2E workflow
        id: trigger_e2e
        env:
          CROSS_REPO_PAT: ${{ secrets.CROSS_REPO_PAT }}
        if: github.event_name == 'push' && env.CROSS_REPO_PAT != ''
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ env.CROSS_REPO_PAT }}
          repository: BrightSwagShop/TestingFramework
          event-type: run-cross-e2e
          client-payload: '{"source_repository":"${{ github.repository }}","source_workflow":"${{ github.workflow }}","source_run_id":"${{ github.run_id }}","sha":"${{ github.sha }}","ref":"${{ github.ref }}"}'

      - name: Wait for E2E workflow to complete
        id: wait_for_e2e
        if: github.event_name == 'push' && steps.trigger_e2e.outcome == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const maxAttempts = 120; // 10 minutes max
            const sourceRunId = '${{ github.run_id }}';
            let attempts = 0;
            let targetRunId = null;
            let workflowConclusion = null;

            while (attempts < maxAttempts && workflowConclusion === null) {
              if (!targetRunId) {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: 'BrightSwagShop',
                  repo: 'TestingFramework',
                  workflow_id: 'e2e.yml',
                  event: 'repository_dispatch',
                  status: 'all',
                  per_page: 20
                });

                const matchingRuns = runs.data.workflow_runs
                  .filter(run => (run.display_title || run.name || '').includes(`source run ${sourceRunId}`))
                  .sort((left, right) => new Date(left.created_at) - new Date(right.created_at));

                if (matchingRuns.length > 0) {
                  targetRunId = matchingRuns[0].id;
                }
              }

              if (targetRunId) {
                const run = await github.rest.actions.getWorkflowRun({
                  owner: 'BrightSwagShop',
                  repo: 'TestingFramework',
                  run_id: targetRunId,
                });

                if (run.data.status === 'completed') {
                  workflowConclusion = run.data.conclusion;
                } else {
                  console.log(`E2E run ${targetRunId} is currently ${run.data.status}; waiting for completion.`);
                }
              }

              if (workflowConclusion === null) {
                console.log(`Waiting for E2E workflow for source run ${sourceRunId}... (${attempts + 1}/${maxAttempts})`);
                await new Promise(resolve => setTimeout(resolve, 5000));
                attempts++;
              }
            }

            if (workflowConclusion === 'success') {
              console.log('E2E workflow completed successfully!');
            } else if (workflowConclusion === 'failure') {
              core.setFailed('E2E workflow failed. Blocking deployment.');
            } else {
              core.setFailed(`E2E workflow did not complete in time or had unknown status: ${workflowConclusion}`);
            }
        
      - name: Deploy to Render
        if: github.event_name == 'push' && (steps.trigger_e2e.outcome == 'skipped' || steps.wait_for_e2e.outcome == 'success')
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}