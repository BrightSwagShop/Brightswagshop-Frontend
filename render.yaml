services:
  - type: static
    name: brightswagshop-frontend
    root: frontend
    buildCommand: npm ci --production --no-optional && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_ENV
        value: production
    routes:
      - type: rewrite
        source: "/auth/callback"
        destination: "/index.html"
      - type: rewrite
        source: "/login"
        destination: "/index.html"
      - type: rewrite
        source: "/login/"
        destination: "/index.html"
      - type: rewrite
        source: "/*"
        destination: "/index.html"
