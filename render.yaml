services:
  - type: static
    name: brightswagshop-frontend
    rootDir: frontend
    buildCommand: npm ci --ignore-scripts && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: "/auth/callback"
        destination: "/index.html"
      - type: rewrite
        source: "/login"
        destination: "/index.html"
      - type: rewrite
        source: "/login/"
        destination: "/index.html"
      - type: rewrite
        source: "/*"
        destination: "/index.html"
